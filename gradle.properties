# 构建必须在 JDK 21 下运行。
#
# 原因：默认 JDK 为 25.0.2，其版本号 Gradle 8.11.1 内置的 Kotlin 脚本编译器无法解析，
# 会直接失败在配置阶段：IllegalArgumentException: 25.0.2
#
# 注意 build.gradle.kts 里的 toolchain { languageVersion = 21 } 救不了这个问题——
# toolchain 只决定「编译目标 JDK」，而失败发生在 Gradle 自身解析 .kts 脚本时，
# 那一步跑在启动 Gradle 的 JVM 上，必须由 org.gradle.java.home 改掉。
#
# 换机器时改这一行，或删掉本行改用 JAVA_HOME 环境变量。
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.6+7

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
